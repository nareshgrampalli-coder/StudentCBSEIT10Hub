<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Workplace safety process and ergonomic workstation</title>
  <desc id="desc">Hazards are identified, assessed, controlled, reported and reviewed; a workstation shows ergonomic positioning.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#dc2626"/></marker><style>.b{fill:#fef2f2;stroke:#dc2626;stroke-width:3}.t{font:700 18px Arial;fill:#7f1d1d}.s{font:15px Arial;fill:#475569}.l{stroke:#dc2626;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="900" height="430" rx="20" fill="#f8fafc"/><text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172554">Safe Workplace: Prevent, Prepare, Respond</text>
  <rect x="25" y="75" width="145" height="65" rx="14" class="b"/><text x="97" y="103" text-anchor="middle" class="t">Identify hazard</text><text x="97" y="125" text-anchor="middle" class="s">observe • inspect</text>
  <rect x="200" y="75" width="145" height="65" rx="14" class="b"/><text x="272" y="103" text-anchor="middle" class="t">Assess risk</text><text x="272" y="125" text-anchor="middle" class="s">likelihood • impact</text>
  <rect x="375" y="75" width="145" height="65" rx="14" class="b"/><text x="447" y="103" text-anchor="middle" class="t">Control hazard</text><text x="447" y="125" text-anchor="middle" class="s">repair • protect</text>
  <rect x="550" y="75" width="145" height="65" rx="14" class="b"/><text x="622" y="103" text-anchor="middle" class="t">Report</text><text x="622" y="125" text-anchor="middle" class="s">record • inform</text>
  <rect x="725" y="75" width="145" height="65" rx="14" class="b"/><text x="797" y="103" text-anchor="middle" class="t">Review</text><text x="797" y="125" text-anchor="middle" class="s">learn • improve</text>
  <path d="M170 108H193M345 108H368M520 108H543M695 108H718M797 140V175H97V147" class="l"/>
  <rect x="55" y="205" width="360" height="180" rx="18" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
  <rect x="240" y="225" width="90" height="65" rx="6" fill="#bae6fd" stroke="#0369a1" stroke-width="3"/><path d="M285 290V315M250 318H320" stroke="#0369a1" stroke-width="5"/>
  <circle cx="170" cy="245" r="20" fill="#fde68a"/><path d="M170 265v70M170 280l60 35M170 290l45 18M170 335l35 40M170 335l-28 40" stroke="#7c2d12" stroke-width="8" stroke-linecap="round"/><path d="M115 300H205V340H115Z" fill="#cbd5e1" stroke="#475569" stroke-width="3"/><text x="360" y="255" text-anchor="end" class="t">Screen near eye level</text><text x="390" y="300" text-anchor="end" class="t">Back supported</text><text x="390" y="345" text-anchor="end" class="t">Feet flat &amp; wrists relaxed</text>
  <rect x="480" y="205" width="365" height="180" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="662" y="238" text-anchor="middle" class="t">Emergency response</text><text x="662" y="275" text-anchor="middle" class="t">Stay calm → Raise alarm → Call help</text><text x="662" y="310" text-anchor="middle" class="t">Evacuate by safe route → Assembly point</text><text x="662" y="345" text-anchor="middle" class="t">First aid/report → Do not re-enter until safe</text>
</svg>
