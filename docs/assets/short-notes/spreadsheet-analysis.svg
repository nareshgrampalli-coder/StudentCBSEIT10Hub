<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
  <title id="title">Spreadsheet analysis workflow</title>
  <desc id="desc">Source sheets consolidate into analysis, what-if tools, macros, and a decision.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#16a34a"/></marker><style>.b{fill:#f0fdf4;stroke:#16a34a;stroke-width:3}.t{font:700 17px Arial;fill:#14532d}.s{font:13px Arial;fill:#475569}.l{stroke:#16a34a;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="900" height="400" rx="20" fill="#f8fafc"/><text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172554">Spreadsheet Data-to-Decision Flow</text>
  <rect x="35" y="75" width="155" height="55" rx="12" class="b"/><text x="112" y="110" text-anchor="middle" class="t">North data</text>
  <rect x="35" y="160" width="155" height="55" rx="12" class="b"/><text x="112" y="195" text-anchor="middle" class="t">South data</text>
  <rect x="35" y="245" width="155" height="55" rx="12" class="b"/><text x="112" y="280" text-anchor="middle" class="t">West data</text>
  <rect x="285" y="135" width="170" height="105" rx="18" fill="#dcfce7" stroke="#15803d" stroke-width="4"/><text x="370" y="173" text-anchor="middle" class="t">Consolidate</text><text x="370" y="198" text-anchor="middle" class="s">sum • average • count</text><text x="370" y="220" text-anchor="middle" class="s">subtotals &amp; outlines</text>
  <rect x="550" y="70" width="150" height="65" rx="12" class="b"/><text x="625" y="99" text-anchor="middle" class="t">Scenarios</text><text x="625" y="120" text-anchor="middle" class="s">compare alternatives</text>
  <rect x="550" y="160" width="150" height="65" rx="12" class="b"/><text x="625" y="189" text-anchor="middle" class="t">Goal Seek</text><text x="625" y="210" text-anchor="middle" class="s">find required input</text>
  <rect x="550" y="250" width="150" height="65" rx="12" class="b"/><text x="625" y="279" text-anchor="middle" class="t">Macros</text><text x="625" y="300" text-anchor="middle" class="s">automate repetition</text>
  <rect x="760" y="150" width="110" height="85" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="815" y="184" text-anchor="middle" class="t">Decision</text><text x="815" y="207" text-anchor="middle" class="s">act on result</text>
  <path d="M190 103L275 165M190 187H275M190 273L275 210M455 187H535M455 187L535 102M455 187L535 282M700 102L750 175M700 192H750M700 282L750 205" class="l"/>
</svg>
