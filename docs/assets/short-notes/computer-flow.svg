<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
  <title id="title">Computer processing cycle</title>
  <desc id="desc">Input data is processed, stored, and delivered as output while security protects the system.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#0891b2"/></marker><style>.b{fill:#ecfeff;stroke:#0891b2;stroke-width:3}.t{font:700 19px Arial;fill:#164e63}.s{font:15px Arial;fill:#475569}.l{stroke:#0891b2;stroke-width:4;marker-end:url(#a)}</style></defs>
  <rect width="900" height="350" rx="20" fill="#f8fafc"/><text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172554">Information Processing System</text>
  <rect x="45" y="95" width="170" height="75" rx="14" class="b"/><text x="130" y="126" text-anchor="middle" class="t">Input devices</text><text x="130" y="150" text-anchor="middle" class="s">keyboard • mouse • scanner</text>
  <rect x="365" y="80" width="170" height="105" rx="18" class="b"/><text x="450" y="116" text-anchor="middle" class="t">Processing</text><text x="450" y="140" text-anchor="middle" class="s">CPU + memory</text><text x="450" y="162" text-anchor="middle" class="s">software instructions</text>
  <rect x="685" y="95" width="170" height="75" rx="14" class="b"/><text x="770" y="126" text-anchor="middle" class="t">Output devices</text><text x="770" y="150" text-anchor="middle" class="s">screen • printer • speaker</text>
  <path d="M215 133H355M535 133H675" class="l"/>
  <rect x="365" y="235" width="170" height="70" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="450" y="265" text-anchor="middle" class="t">Storage</text><text x="450" y="287" text-anchor="middle" class="s">SSD • hard disk • cloud</text>
  <path d="M425 185V227M475 227V185" class="l"/>
  <rect x="55" y="245" width="210" height="52" rx="26" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="160" y="277" text-anchor="middle" class="t">Security + backups</text>
  <path d="M265 271H355" class="l"/>
</svg>
