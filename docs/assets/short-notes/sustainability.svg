<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">Sustainable development balance</title>
  <desc id="desc">Environment, society, and economy overlap to create sustainability, with a hierarchy of waste prevention.</desc>
  <defs><style>.t{font:700 20px Arial;fill:#fff}.s{font:700 18px Arial;fill:#334155}.h{font:700 18px Arial;fill:#052e16}</style></defs>
  <rect width="900" height="430" rx="20" fill="#f8fafc"/><text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#172554">Sustainable Choices Balance Three Pillars</text>
  <circle cx="390" cy="160" r="100" fill="#22c55e" fill-opacity=".78"/><circle cx="510" cy="160" r="100" fill="#0ea5e9" fill-opacity=".78"/><circle cx="450" cy="240" r="100" fill="#f59e0b" fill-opacity=".78"/>
  <text x="335" y="120" text-anchor="middle" class="t">Environment</text><text x="565" y="120" text-anchor="middle" class="t">Society</text><text x="450" y="285" text-anchor="middle" class="t">Economy</text><text x="450" y="190" text-anchor="middle" class="t">SUSTAINABLE</text>
  <rect x="635" y="65" width="220" height="35" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="745" y="89" text-anchor="middle" class="s">WASTE HIERARCHY</text>
  <rect x="635" y="115" width="220" height="42" rx="8" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><text x="745" y="142" text-anchor="middle" class="h">1. Prevent / Refuse</text>
  <rect x="650" y="165" width="205" height="42" rx="8" fill="#bef264" stroke="#4d7c0f" stroke-width="2"/><text x="752" y="192" text-anchor="middle" class="h">2. Reduce</text>
  <rect x="665" y="215" width="190" height="42" rx="8" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/><text x="760" y="242" text-anchor="middle" class="h">3. Reuse / Repair</text>
  <rect x="680" y="265" width="175" height="42" rx="8" fill="#fdba74" stroke="#ea580c" stroke-width="2"/><text x="767" y="292" text-anchor="middle" class="h">4. Recycle</text>
  <rect x="695" y="315" width="160" height="42" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="2"/><text x="775" y="342" text-anchor="middle" class="h">5. Safe disposal</text>
  <text x="745" y="386" text-anchor="middle" class="s">Most preferred ↓ Last option</text>
</svg>
